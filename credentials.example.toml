# visa-ping login credentials for AUTO-LOGIN.
# Copy to credentials.toml (gitignored) and fill in; then `chmod 600 credentials.toml`.
# If credentials.toml exists, `uv run visa-ping` logs in automatically and
# falls back to manual login (with an email alert) when that fails.
# Delete the file to go back to manual-only login.

username = "your-login-email"
password = "your-password"

# All account security questions (the site shows a random 2 of them each
# login). Copy each question exactly as the login page displays it — match
# is case/whitespace/punctuation-insensitive substring, so a trailing '*'
# or numbering is fine, but the wording must match. Example questions the
# site uses (yours may differ — use your own):
[[security_questions]]
question = "What is the name of the town/city where you were born?"
answer = "..."

[[security_questions]]
question = "What is your favorite food?"
answer = "..."

[[security_questions]]
question = "Who was your childhood hero?"
answer = "..."
