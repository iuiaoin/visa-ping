[project]
name = "visa-ping"
version = "0.1.0"
description = "Monitor US visa appointment slots on usvisascheduling.com, email alerts, optional auto-booking"
requires-python = ">=3.11"
dependencies = [
    "nodriver>=0.38",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
visa-ping = "visa_ping.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# files.pythonhosted.org is unreachable from this network; use the TUNA mirror.
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/visa_ping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
